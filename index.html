<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수선증 전자 접수</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#faf7f0;--card:#fff;--ink:#1d2433;--navy:#1f3358;--line:#d9d3c4;--mut:#6b6f7a;--bad:#b3261e;--soft:#f1ece0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141820;--card:#1d2330;--ink:#eef0f5;--navy:#8fb0ee;--line:#3a4256;--mut:#9aa1b2;--bad:#ff8a80;--soft:#262d3d;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:18px;line-height:1.55}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--navy);color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
.tabs button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:8px 16px;border-radius:8px;font-size:16px;margin-left:6px}
.tabs button.on{background:#fff;color:#1f3358}
main{max-width:860px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h2{font-size:19px;margin:0 0 12px;color:var(--navy)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:16px}
input,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:14px 24px;font-weight:700;font-size:18px}
.btn.sec{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.btn.red{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:15px}
.term{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--soft)}
.term input{width:28px;height:28px;flex:none;margin-top:3px;accent-color:#1f3358}
.err{color:var(--bad);font-weight:600;margin:8px 0;min-height:1em}
.bad{border-color:var(--bad)!important}
canvas#sig{width:100%;height:200px;border:2px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
.ov>div{background:var(--card);border-radius:12px;padding:18px;max-width:860px;width:100%}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.mut{color:var(--mut);font-size:15px}
.rc{background:#fff;color:#111;padding:36px;width:794px;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;line-height:1.6}
.rc h3{text-align:center;font-size:26px;margin:0 0 4px}
.rc table td,.rc table th{border:1px solid #999;padding:7px 9px;white-space:normal}
.rc th{background:#f0ece0;width:22%}
.rc ol{padding-left:20px}
.rc img{height:90px;border-bottom:1px solid #444}
#pdfbox{position:absolute;left:-9999px;top:0}
.view{overflow:auto}.view .rc{transform-origin:0 0}
</style>
</head>
<body>
<header><h1 id="shopTitle">수선증</h1><div class="tabs"><button id="tCus" class="on">고객 작성</button><button id="tAdm">관리자</button></div></header>
<main id="app"></main>
<div id="pdfbox"></div>
<script>
(function(){
var DEF={shop:"명품수선전문점",terms:[
"[작업 전 안내] 접수 시 제품 상태(오염·손상·기존 수선 흔적)를 함께 확인하였으며, 소재 특성상 작업 중 변색·변형·손상이 발생할 수 있음을 안내받았습니다.",
"[수선 내용·비용] 위에 기재된 수선 내용과 비용을 확인하였으며, 작업 중 추가 작업이 필요한 경우 별도 안내 후 동의를 거쳐 진행됨을 이해합니다.",
"[보관 안내] 수선 완료 연락 후 정해진 기간 내에 수령하지 않을 경우 보관 책임이 제한될 수 있음을 안내받았습니다.",
"[분실·파손 안내] 수선 후 분실·파손 시 보상 기준과 범위를 안내받았으며 이에 동의합니다.",
"[고객 주의사항] 제품 내 귀중품·부속품은 접수 전 확인하였으며, 수령 시 제품 상태를 직접 확인하겠습니다.",
"[개인정보 수집·이용] 수선 접수 및 사후 관리 목적으로 이름·연락처가 수집·보관되는 것에 동의합니다."]};
var S={};try{S=JSON.parse(localStorage.getItem("rs_set")||"{}")}catch(e){}
S.shop=S.shop||DEF.shop;S.terms=S.terms||DEF.terms;
function save(){try{localStorage.setItem("rs_set",JSON.stringify(S))}catch(e){}}
var $=function(s,r){return(r||document).querySelector(s)};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function won(n){return n===""||n==null?"":Number(n).toLocaleString("ko-KR")+"원"}
/* IndexedDB */
function db(){return new Promise(function(res,rej){var r=indexedDB.open("repair",1);r.onupgradeneeded=function(){r.result.createObjectStore("rec",{keyPath:"id"})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction("rec",mode),q=fn(t.objectStore("rec"));t.oncomplete=function(){res(q&&q.result)};t.onerror=function(){rej(t.error)}})})}
/* receipt html */
function recHTML(r){
var terms=r.terms.map(function(t){return"<li>"+esc(t)+" <b>(확인 ✓)</b></li>"}).join("");
return'<div class="rc"><h3>'+esc(r.shop)+' 수선증</h3><div style="text-align:center;color:#555;margin-bottom:12px">접수번호 '+esc(r.no)+' · 접수일 '+esc(r.date)+'</div>'+
'<table style="width:100%;border-collapse:collapse"><tr><th>고객명</th><td>'+esc(r.name)+'</td><th>연락처</th><td>'+esc(r.phone)+'</td></tr>'+
'<tr><th>제품(브랜드/품목)</th><td colspan="3">'+esc(r.item)+'</td></tr>'+
'<tr><th>제품 상태 메모</th><td colspan="3">'+esc(r.cond||"-")+'</td></tr>'+
'<tr><th>수선 내용</th><td colspan="3" style="white-space:pre-wrap">'+esc(r.work)+'</td></tr>'+
'<tr><th>수선 비용</th><td>'+won(r.cost)+'</td><th>선금</th><td>'+(r.deposit?won(r.deposit):"-")+'</td></tr>'+
'<tr><th>수령 예정일</th><td colspan="3">'+esc(r.due||"-")+'</td></tr></table>'+
'<h4 style="margin:16px 0 4px">안내 및 주의사항 확인</h4><ol>'+terms+'</ol>'+
'<div style="margin-top:14px">위 내용을 모두 읽고 확인하였으며 이에 동의합니다.</div>'+
'<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px"><div>작성 완료: '+esc(new Date(r.at).toLocaleString("ko-KR"))+'</div><div>고객 서명&nbsp; <img src="'+r.sig+'" alt="서명"></div></div></div>'}
function toPDF(r){
var box=$("#pdfbox");box.innerHTML=recHTML(r);
return html2canvas(box.firstChild,{scale:2,backgroundColor:"#ffffff"}).then(function(c){
var pdf=new window.jspdf.jsPDF("p","mm","a4"),W=210,H=297,ih=c.height*W/c.width,img=c.toDataURL("image/jpeg",0.92),y=0;
while(y<ih-1){if(y>0)pdf.addPage();pdf.addImage(img,"JPEG",0,-y,W,ih);y+=H}
pdf.save(r.date+"_"+r.name.replace(/[\\/:*?"<>|\s]/g,"")+"_수선증.pdf");box.innerHTML=""})}
/* views */
var app=$("#app"),unlocked=false,sigDirty=false;
function setTab(a){$("#tCus").className=a?"":"on";$("#tAdm").className=a?"on":""}
$("#tCus").onclick=function(){unlocked=false;setTab(0);customer()};
$("#tAdm").onclick=function(){setTab(1);admin()};
function title(){$("#shopTitle").textContent=S.shop+" · 수선증"}
function customer(){
title();
app.innerHTML='<div class="card"><h2>고객 정보</h2><div class="row"><div><label>이름 *</label><input id="f_name" autocomplete="off"></div><div><label>연락처 *</label><input id="f_phone" type="tel" inputmode="tel" placeholder="010-0000-0000"></div></div>'+
'<div class="row"><div><label>제품(브랜드/품목) *</label><input id="f_item" placeholder="예: 샤넬 클래식 플랩백"></div><div><label>수령 예정일</label><input id="f_due" type="date"></div></div>'+
'<label>제품 상태 메모</label><textarea id="f_cond" placeholder="접수 시 확인한 흠집·오염 등"></textarea>'+
'<label>수선 내용 *</label><textarea id="f_work"></textarea>'+
'<div class="row"><div><label>수선 비용(원) *</label><input id="f_cost" type="number" inputmode="numeric" min="0"></div><div><label>선금(원)</label><input id="f_dep" type="number" inputmode="numeric" min="0"></div></div></div>'+
'<div class="card"><h2>안내 및 주의사항 확인 *</h2><div class="bar" style="margin:0 0 10px"><button class="btn sec sm" id="allOk">전체 확인</button></div><div id="terms"></div></div>'+
'<div class="card"><h2>고객 서명 *</h2><canvas id="sig"></canvas><div class="bar"><button class="btn sec" id="clr">서명 지우기</button></div></div>'+
'<div class="err" id="err"></div><div class="bar"><button class="btn" id="rev">내용 확인</button><button class="btn sec" id="rst">처음부터 다시</button></div>';
$("#terms").innerHTML=S.terms.map(function(t,i){return'<label class="term" style="font-weight:400;margin:0 0 10px"><input type="checkbox" class="tk" data-i="'+i+'"><span>'+esc(t)+'</span></label>'}).join("");
$("#allOk").onclick=function(){document.querySelectorAll(".tk").forEach(function(c){c.checked=true})};
initSig();
$("#clr").onclick=function(){clearSig()};
$("#rst").onclick=function(){if(confirm("입력한 내용을 모두 지우고 처음부터 다시 작성할까요?"))customer()};
$("#rev").onclick=review}
var cv,cx;
function clearSig(){cx.clearRect(0,0,cv.width,cv.height);sigDirty=false}
function initSig(){
cv=$("#sig");sigDirty=false;var dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;cx=cv.getContext("2d");cx.scale(dpr,dpr);cx.lineCap="round";cx.lineJoin="round";cx.strokeStyle="#111";
var down=false,lx,ly;
function pt(e){var b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]}
cv.addEventListener("pointerdown",function(e){e.preventDefault();down=true;cv.setPointerCapture(e.pointerId);var p=pt(e);lx=p[0];ly=p[1];cx.beginPath();cx.arc(lx,ly,1,0,6.3);cx.fillStyle="#111";cx.fill();sigDirty=true});
cv.addEventListener("pointermove",function(e){if(!down)return;e.preventDefault();var p=pt(e),pr=e.pressure>0?e.pressure:0.5;cx.lineWidth=1.5+pr*2.5;cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(p[0],p[1]);cx.stroke();lx=p[0];ly=p[1]});
["pointerup","pointercancel","pointerleave"].forEach(function(n){cv.addEventListener(n,function(){down=false})})}
function val(id){return $("#"+id).value.trim()}
function review(){
var miss=[],ids={f_name:"이름",f_phone:"연락처",f_item:"제품",f_work:"수선 내용",f_cost:"수선 비용"};
document.querySelectorAll(".bad").forEach(function(e){e.classList.remove("bad")});
Object.keys(ids).forEach(function(k){if(!val(k)){miss.push(ids[k]);$("#"+k).classList.add("bad")}});
var unchecked=[].filter.call(document.querySelectorAll(".tk"),function(c){return!c.checked});
if(unchecked.length){miss.push("안내사항 확인 "+unchecked.length+"건");unchecked.forEach(function(c){c.parentNode.classList.add("bad")})}
if(!sigDirty){miss.push("서명");cv.classList.add("bad")}
if(miss.length){$("#err").textContent="작성되지 않은 항목이 있습니다: "+miss.join(", ");window.scrollTo({top:0,behavior:"smooth"});return}
$("#err").textContent="";
var d=new Date(),no=today().replace(/-/g,"")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+String(Math.floor(Math.random()*90+10));
var r={id:"r"+Date.now(),no:no,shop:S.shop,date:today(),at:d.toISOString(),name:val("f_name"),phone:val("f_phone"),item:val("f_item"),due:val("f_due"),cond:val("f_cond"),work:val("f_work"),cost:val("f_cost"),deposit:val("f_dep"),terms:S.terms.slice(),sig:cv.toDataURL("image/png")};
var o=document.createElement("div");o.className="ov";
o.innerHTML='<div><h2>작성 내용을 확인해 주세요</h2><div class="view scroll" id="pv"></div><div class="bar"><button class="btn" id="ok">최종 제출</button><button class="btn sec" id="back">수정하기</button></div></div>';
document.body.appendChild(o);var pv=$("#pv",o);pv.innerHTML=recHTML(r);
var sc=Math.min(1,(pv.clientWidth||700)/794);pv.firstChild.style.transform="scale("+sc+")";pv.style.height=(pv.firstChild.offsetHeight*sc)+"px";
$("#back",o).onclick=function(){o.remove()};
$("#ok",o).onclick=function(){tx("readwrite",function(s){return s.put(r)}).then(function(){o.remove();done(r)}).catch(function(){alert("저장에 실패했습니다. 브라우저 저장소 설정을 확인해 주세요.")})}}
function done(r){
app.innerHTML='<div class="card" style="text-align:center"><h2>작성이 완료되었습니다</h2><p>접수번호 <b>'+esc(r.no)+'</b><br>'+esc(r.name)+' 고객님, 감사합니다.</p><div class="bar" style="justify-content:center"><button class="btn" id="dl">PDF 다운로드</button><button class="btn sec" id="nw">새 수선증 작성</button></div><p class="mut">다음 고객을 위해 “새 수선증 작성”을 눌러 화면을 초기화해 주세요.</p></div>';
$("#dl").onclick=function(){toPDF(r)};$("#nw").onclick=customer}
/* admin */
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return[].map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function admin(){
if(unlocked)return panel();
var first=!S.pin;
app.innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><h2>'+(first?"관리자 비밀번호 설정":"관리자 로그인")+'</h2><label>'+(first?"새 비밀번호(4자리 이상)":"비밀번호")+'</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><div class="err" id="pe"></div><button class="btn" id="go">'+(first?"설정하고 입장":"입장")+'</button></div>';
$("#go").onclick=function(){var v=$("#pin").value;if(v.length<4){$("#pe").textContent="4자리 이상 입력해 주세요.";return}
sha(v).then(function(h){if(first){S.pin=h;save();unlocked=true;panel()}else if(h===S.pin){unlocked=true;panel()}else $("#pe").textContent="비밀번호가 맞지 않습니다."})}}
function panel(){
title();
app.innerHTML='<div class="card"><h2>보관된 수선증</h2><input id="q" placeholder="이름·연락처·접수번호 검색"><div class="scroll" style="margin-top:10px"><table id="tb"></table></div><div class="bar"><button class="btn sec sm" id="exp">백업 내려받기(JSON)</button><button class="btn sec sm" id="imp">백업 불러오기</button><input type="file" id="fi" accept=".json" hidden><button class="btn red sm" id="delAll">전체 삭제</button></div></div>'+
'<div class="card"><h2>양식 설정</h2><label>상호명</label><input id="s_shop"><label>안내·주의사항 (한 줄에 한 항목)</label><textarea id="s_terms" style="min-height:240px"></textarea><div class="bar"><button class="btn" id="s_save">저장</button><button class="btn sec" id="s_pin">비밀번호 변경</button></div><p class="mut">기본 문구는 예시입니다. 실제 사용 전 법률 전문가의 검토를 받아 수정하세요. 수정은 이후 작성되는 수선증부터 적용됩니다.</p></div>'+
'<div class="card"><h2>안내</h2><p class="mut">모든 데이터는 이 기기의 브라우저(IndexedDB)에만 저장되며 외부로 전송되지 않습니다. 브라우저 데이터 삭제·기기 교체 시 사라지므로 주기적으로 백업하세요. 비밀번호 보호는 간단한 화면 잠금 수준이며 암호화 저장이 아닙니다.</p></div>';
$("#s_shop").value=S.shop;$("#s_terms").value=S.terms.join("\n");
$("#s_save").onclick=function(){var t=$("#s_terms").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);if(!t.length){alert("항목을 1개 이상 입력해 주세요.");return}S.shop=$("#s_shop").value.trim()||DEF.shop;S.terms=t;save();title();alert("저장되었습니다.")};
$("#s_pin").onclick=function(){var v=prompt("새 비밀번호(4자리 이상)");if(v&&v.length>=4)sha(v).then(function(h){S.pin=h;save();alert("변경되었습니다.")})};
var all=[];
function draw(){var q=$("#q").value.trim().toLowerCase();var rows=all.filter(function(r){return!q||(r.name+r.phone+r.no+r.item).toLowerCase().indexOf(q)>=0});
$("#tb").innerHTML='<tr><th>접수번호</th><th>이름</th><th>연락처</th><th>제품</th><th>비용</th><th></th></tr>'+(rows.map(function(r){return'<tr><td>'+esc(r.no)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.item)+'</td><td>'+won(r.cost)+'</td><td><button class="btn sm" data-a="pdf" data-i="'+r.id+'">PDF</button> <button class="btn sec sm" data-a="view" data-i="'+r.id+'">보기</button> <button class="btn red sm" data-a="del" data-i="'+r.id+'">삭제</button></td></tr>'}).join("")||'<tr><td colspan="6" class="mut">저장된 수선증이 없습니다.</td></tr>')}
function load(){tx("readonly",function(s){return s.getAll()}).then(function(a){all=(a||[]).sort(function(x,y){return y.at.localeCompare(x.at)});draw()})}
load();$("#q").oninput=draw;
$("#tb").onclick=function(e){var b=e.target.closest("button");if(!b)return;var r=all.filter(function(x){return x.id===b.dataset.i})[0];if(!r)return;
